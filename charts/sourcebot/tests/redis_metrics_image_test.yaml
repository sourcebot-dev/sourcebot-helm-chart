suite: test bundled Redis metrics image
templates:
  - charts/redis/templates/configmap.yaml
  - charts/redis/templates/health-configmap.yaml
  - charts/redis/templates/scripts-configmap.yaml
  - charts/redis/templates/secret.yaml
  - charts/redis/templates/primary/application.yaml
tests:
  - it: should use the legacy exporter image when metrics are enabled
    values:
      - ../values.lint.yaml
    set:
      redis.metrics.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[1].image
          value: docker.io/bitnamilegacy/redis-exporter:1.67.0-debian-12-r7
        template: charts/redis/templates/primary/application.yaml
