{{- if and .Values.sourcebot.persistence.enabled (not .Values.sourcebot.persistence.existingClaim) }}
{{- $pvcName := printf "%s-%s" (include "sourcebot.fullname" .) "data" -}}
{{- $existingPvc := (lookup "v1" "PersistentVolumeClaim" $.Release.Namespace $pvcName) -}}
{{- /*
An explicit `sourcebot.persistence.size` always wins. When it is unset, an
existing PVC keeps its current size, so changing the chart default never
resizes a live volume on upgrade (which fails on storage classes without
`allowVolumeExpansion`). New installs get the chart default.
*/ -}}
{{- $size := .Values.sourcebot.persistence.size -}}
{{- if not $size -}}
{{- $size = dig "spec" "resources" "requests" "storage" "100Gi" $existingPvc -}}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sourcebot.fullname" . }}-data
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sourcebot.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- with .Values.sourcebot.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- range .Values.sourcebot.persistence.accessModes }}
    - {{ . }}
    {{- end }}
  resources:
    requests:
      storage: {{ $size }}
  {{- if .Values.sourcebot.persistence.storageClass }}
  {{- if (eq "-" .Values.sourcebot.persistence.storageClass) }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ .Values.sourcebot.persistence.storageClass }}
  {{- end }}
  {{- end }}
  {{- if and $existingPvc $existingPvc.spec.volumeName }}
  volumeName: {{ $existingPvc.spec.volumeName }}
  {{- end }}
{{- end }}

