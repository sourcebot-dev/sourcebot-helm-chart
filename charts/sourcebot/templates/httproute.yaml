{{- if $.Values.sourcebot.httpRoute.enabled -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "sourcebot.fullname" $ }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sourcebot.labels" $ | nindent 4 }}
  {{- with $.Values.sourcebot.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $.Values.sourcebot.httpRoute.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $.Values.sourcebot.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- with $.Values.sourcebot.httpRoute.rules }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "sourcebot.fullname" $ }}
          port: {{ $.Values.sourcebot.service.port }}
    {{- end }}
{{- end }}
